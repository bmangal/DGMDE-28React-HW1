<html>
<head>
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .square {
            border: 1px solid #999;
            width: 100px;
            height: 100px;
            text-transform: uppercase;
            display: inline-block;
            margin: 5px;
            font-size: 24px;
            box-sizing: border-box;
            vertical-align: top;
            padding: 35px;
        }

        .square:hover {
            background-color: #e0e0e0;
        }

        .action {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }

        .status {
            font-size: 18px;
            border: 2px solid #333; 
            display: inline-block; padding: 8px 20px; 
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <h1>Tic Tac Toe Game</h1>
    <div class="status">Turn</div>

    <div class="board">
        <script>
            const NUM_SQUARES = 9;
            for (i=0; i<NUM_SQUARES; i++)
            {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
            }

            // Find all square divs and insert a <br /> after every 3rd square
            window.onload = function() {
                const board = document.querySelector('.board');
                const squares = board.querySelectorAll('.square');
                let player = ''; // Placeholder for current player, can be toggled in a full implementation

                for (let i = 0; i < NUM_SQUARES; i++) {
                    const square = squares[i];

                    // Add click event listener to each square
                    square.addEventListener('click', function() {

                        // Prevent overwriting an already filled X/O square
                        if (this.innerText !== '') return;

                        // Initial player random assignment based on current second (for demonstration purposes)
                        if (player === '') {
                            const currentSecond = new Date().getSeconds();
                            console.log('Current second:', currentSecond);
                            if ((currentSecond/2) % 2 === 0) {
                                player = 'O';
                            } else {
                                player = 'X';
                            }
                        } 
                        
                        this.innerText = player;
                        
                        if (player === 'X') {
                            player = 'O';
                        } else {
                            player = 'X';
                        }

                        document.querySelector('.status').innerText = player + "'s Turn";
                    });

                    // Add a line break after every 3rd square.
                    // Switched to using br element approach instead of modifying outerHTML to avoid losing event listeners.
                    if ((i + 1) % 3 === 0) {
                        const br = document.createElement('br');
                        square.parentNode.insertBefore(br, square.nextSibling);
                    }
                    
                }
            };

        </script>
    </div>

    <input type="button" class="action" value="Start Game">
    <br><br>
    <a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Learn Game</a>
</body>
</html>
