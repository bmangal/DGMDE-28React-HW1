<html>
<head>
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .square {
            border: 1px solid #999;
            width: 100px;
            height: 100px;
            text-transform: uppercase;
            display: inline-block;
            margin: 5px;
            font-size: 24px;
            box-sizing: border-box;
            vertical-align: top;
            padding: 35px;
        }

        .square:hover {
            background-color: #e0e0e0;
        }

        .action {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }

        .status {
            font-size: 18px;
            border: 2px solid #333; 
            display: inline-block; padding: 8px 20px; 
            border-radius: 8px;
        }

    </style>
</head>
<body>
    <h1>Tic Tac Toe Game</h1>
    <div class="status">Turn</div>

    <div class="board">
        <script>
            const NUM_SQUARES = 9;
            let player = ''; // Placeholder for current player, can be toggled in a full implementation
            let isGameOver = false; // Flag to track if the game has ended

            for (i=0; i<NUM_SQUARES; i++)
            {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
            }

            // Returns the text of a square: X, O, and - for empty squares.
            function squareText(square) {
                if (square.innerText === '') {
                    return '-';
                } else {
                    return square.innerText;
                }
            }

            // Find all square divs and insert a <br /> after every 3rd square
            window.onload = function() {
                const board = document.querySelector('.board');
                const squares = board.querySelectorAll('.square');

                for (let i = 0; i < NUM_SQUARES; i++) {
                    const square = squares[i];

                    // Add click event listener to each square
                    square.addEventListener('click', function() {

                        // Check if the game is already over or if the square is already filled
                        // Prevent overwriting an already filled X/O square or making moves after the game has ended
                        if (isGameOver === true || this.innerText !== '') return;

                        // Initial player random assignment based on current second (for demonstration purposes)
                        if (player === '') {
                            const currentSecond = new Date().getSeconds();
                            console.log('Current second:', currentSecond);
                            if ((currentSecond/2) % 2 === 0) {
                                player = 'O';
                            } else {
                                player = 'X';
                            }
                        } 
                        
                        this.innerText = player;

                        // Create moves array by mapping over squares and getting their text
                        const squaresArray = Array.from(squares);
                        const moves = squaresArray.map(sq => squareText(sq));
                        console.log("Moves:", moves);

                        // Create winConditions array like: “XOO” , “XX-” , “O--“ , “XXO”
                        const winConditions = [
                            squareText(squares[0]) + squareText(squares[1]) + squareText(squares[2]), // Row 1
                            squareText(squares[3]) + squareText(squares[4]) + squareText(squares[5]), // Row 2
                            squareText(squares[6]) + squareText(squares[7]) + squareText(squares[8]), // Row 3
                            squareText(squares[0]) + squareText(squares[3]) + squareText(squares[6]), // Column 1
                            squareText(squares[1]) + squareText(squares[4]) + squareText(squares[7]), // Column 2
                            squareText(squares[2]) + squareText(squares[5]) + squareText(squares[8]), // Column 3
                            squareText(squares[0]) + squareText(squares[4]) + squareText(squares[8]), // Diagonal 1
                            squareText(squares[2]) + squareText(squares[4]) + squareText(squares[6])  // Diagonal 2
                        ];
                        console.log("Win Conditions:", winConditions);

                        // Toggle player for next turn
                        if (player === 'X') {
                            player = 'O';
                        } else {
                            player = 'X';
                        }

                        let statusText = '';
                        if (winConditions.includes('XXX')) {
                            statusText = 'X is the Winner';
                            isGameOver = true; // Set game over flag to prevent further moves
                        }
                        else if (winConditions.includes('OOO')) {
                            statusText = 'O is the Winner';
                            isGameOver = true; // Set game over flag to prevent further moves
                        }
                        else if (!moves.includes('-')) {
                            statusText = 'Stalemate Game';
                            isGameOver = true; // Set game over flag to prevent further moves
                        }
                        else {
                            statusText = player + "'s Turn";
                        }
                        document.querySelector('.status').innerText = statusText;
                    });

                    // Add a line break after every 3rd square.
                    // Switched to using br element approach instead of modifying outerHTML to avoid losing event listeners.
                    if ((i + 1) % 3 === 0) {
                        const br = document.createElement('br');
                        square.parentNode.insertBefore(br, square.nextSibling);
                    }
                    
                }
            };

            // Function to reset the game state and clear the board squares.
            function resetGame() {
                const squares = document.querySelectorAll('.square');
                squares.forEach(sq => sq.innerText = '');
                document.querySelector('.status').innerText = 'Turn';
                isGameOver = false;
            }

        </script>
    </div>

    <input type="button" class="action" value="Start Game" onclick="resetGame()">
    <br><br>
    <a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Learn Game</a>
</body>
</html>
