<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <style>
        @media (max-width: 700px) 
        {
        }
        .container {
            text-align: center;
            padding: 30px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 200px;
            border: 2px solid #ddd;
            text-transform: uppercase; /* Automatically convert input to uppercase */
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            font-size: 16px;
            background-color: #65a8d4;
            border: none;
        }

        .restart-btn {
            background-color: #d86f78;
        }

        .guess-row, .guess-row-small {
            display: flex;
            justify-content: center;
        }
        .guess-row {
            gap: 8px;
            margin-bottom: 10px;
        }
        .guess-row-small {
            gap: 2px;
            margin-bottom: 3px;
        }

        .letter-tile, .letter-tile-small {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .letter-tile {
            width: 50px;
            height: 50px;
            border: 2px solid #ccc;
            font-size: 24px;
        }
        .letter-tile-small {
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;
            font-size: 12px;
        }

        .correct {
            background-color: #6aaa64;
            border-color: #6aaa64;
        }

        .present {
            background-color: #c9b458;
            border-color: #c9b458;
        }

        .absent {
            background-color: #d3d6da;
            border-color: #d3d6da;
        }

        .message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }

        .success {
            color: #6aaa64;
        }

        .error {
            color: #d32f2f;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Wordle</h1>
        <div class="game-info">
            <p id="header1">Guess the 5-letter word in 6 attempts</p>
            <p>Attempts left: <span id="triesLeft">6</span></p>
            <div id="stats"></div>
        </div>

        <div class="guesses-container" id="guessesContainer"></div>

        <div class="input-section">
            <input type="text" id="guessInput"  maxlength="5">
            <button id="guess" onclick="checkMyGuess()">Check my Guess</button>
        </div>

        <div class="message" id="message"></div>
        <button class="restart-btn" onclick="newGame()">Restart Game</button>
        <button style="background-color: gray;" onclick="resetStats()">Reset Stats</button>
    </div>

    <script>
        
        // Game class to manage the state and logic of a single instance of the Wordle game.
        function Game(maxTries, maxWordLength) {
            this.maxTries = maxTries;
            this.maxWordLength = maxWordLength;
            this.answerWord = '';
            this.guesses = [];
            this.triesLeft = maxTries;

            // Reset the game state to start a new game, including generating a new answer word and resetting guesses and tries left.
            this.resetGame = async function() {
                this.answerWord = '';

                // Reset guesses and tries left to their initial values 
                this.guesses = [];
                this.triesLeft = this.maxTries;
            
                this.answerWord = await this.generateWordByApi1(this.maxWordLength);
                console.log(`Answer Word : ${this.answerWord}`);
            }

            // Call API to get a random word of specified length and set it as the answer
            this.generateWordByApi1 = async function(wordLength) {

                let word = ''; // Set a default word in case of API failure

                await fetch(`https://random-word-api.herokuapp.com/word?length=${wordLength}`)
                    .then(res => res.json())
                    .then(data => {
                        // Log the API response to verify the structure and content
                        console.log('API Response:', data);

                        // Check if the response contains a valid word and set it as the answer
                        if (data && data.length > 0) {
                            word = data[0].toUpperCase();
                            console.log(`Answer Word from API: ${word}`);
                        }
                    })
                    .catch(error => {
                        // Log any errors that occur during the API call
                        console.error('Error fetching word from API:', error);
                    });

                return word;
            }

            // Get any error by validating the user's guess
            this.validateGuess = function(guess) {
                // Check if the guess contains only alphabetic characters
                if (!/^[A-Z]+$/.test(guess)) {
                    return 'Please enter only alphabetic characters';
                }
                // Check if the guess is of the correct length
                if (guess.length !== MAX_WORD_LENGTH) {
                    return `Please enter a ${MAX_WORD_LENGTH} letter word`;
                }
                return null;
            }
        
            // Add the player's guess to the list of guesses and decrease the number of tries left
            this.addGuess = function(input) {
                // Add the guess to the list of guesses.
                this.guesses.push(input);
                // Decrease the number of tries left.
                this.triesLeft--;
            }

            // Check if the player's last guess matches the answer word
            this.didPlayerWin = function() {
                return this.guesses[this.guesses.length - 1] === this.answerWord;        
            }

            // Check if the player has used all attempts without guessing the answer word
            this.didPlayerLose = function() {
                return this.triesLeft === 0 && this.guesses[this.guesses.length - 1] !== this.answerWord;
            }
        } // Game class


        const MAX_TRIES = 6;
        const MAX_WORD_LENGTH = 5;
        let game = new Game(MAX_TRIES, MAX_WORD_LENGTH);

        // Function to start a new game
        function newGame() {
            // Reset the game state
            game.resetGame();

            // Update global variables with the new game state
            // Enable input and buttons, and reset message
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guess').disabled = false;
            document.getElementById('message').textContent = '';

            // Refresh the game display and keyboard display
            clearGuessInputAndFocus();
            updateGameDisplay();
            updateKeyboardDisplay();
            displayStats();
        }

        // Check the user's guess against the answer word and update the game state accordingly
        function checkMyGuess() {
            // Get the user's guess and the container for displaying guesses and message element
            let container = document.getElementById('guessesContainer');
            let input = document.getElementById('guessInput').value.toUpperCase();
            let messageEl = document.getElementById('message');

            // Clear any previous messages
            messageEl.textContent = '';

            var validationError = game.validateGuess(input);
            if (validationError) {
                messageEl.textContent = validationError;
                messageEl.classList.add('error');
                return;
            }
                
            // Add the guess to the list of guesses.
            game.addGuess(input);

            // Check if the player has won or lost and update the message
            if (game.didPlayerWin()) {
                messageEl.textContent = `Congratulations! You won in ${MAX_TRIES - game.triesLeft} attempts!`;
                messageEl.classList.add('success');
                endGame();
            } else if (game.didPlayerLose()) {
                messageEl.textContent = `Game Over! The word was ${game.answerWord}`;
                messageEl.classList.add('error');
                endGame();
            }

            // Refresh the game display and keyboard display
            clearGuessInputAndFocus();
            updateGameDisplay();
            updateKeyboardDisplay();
        }

        // Clear the guess input field and set focus back to it
        function clearGuessInputAndFocus() {
            let input = document.getElementById('guessInput');
            input.value = '';
            input.focus();
        }

        // Disable the input and guess button to end the game
        function endGame() {
            document.getElementById('guessInput').disabled = true;
            document.getElementById('guess').disabled = true;

            // Update the stats value in local storage based on whether the player won or lost
            // Retrieve the current stats from local storage, increment the games played, and if the player won, increment the games won as well. Then save the updated stats back to local storage.
            // If there are no existing stats in local storage, it initializes them to 0.
            let gamesWon = localStorage.getItem('gamesWon') || 0;
            let gamesPlayed = localStorage.getItem('gamesPlayed') || 0;
            gamesPlayed++;
            localStorage.setItem('gamesPlayed', gamesPlayed);
            if (game.didPlayerWin()) {
                gamesWon++;
                localStorage.setItem('gamesWon', gamesWon);
            }
            displayStats();
        }

        // Display the player's game statistics (games won and games played) on the page.
        // This function retrieves the stats from local storage and updates the stats display element with the current values.
        // If there are no games played, it will not display any stats.
        function displayStats() {
            let gamesWon = localStorage.getItem('gamesWon') || 0;
            let gamesPlayed = localStorage.getItem('gamesPlayed') || 0;

            if (gamesPlayed > 0) {
                document.getElementById('stats').textContent = `You won ${gamesWon} out of ${gamesPlayed} games`;
            }
            else {
                document.getElementById('stats').textContent = '';
            }
        }

        // Reset the player's game statistics by setting the games won and games played values in local storage back to 0, and then update the stats display on the page.
        function resetStats() {
            localStorage.setItem('gamesWon', 0);
            localStorage.setItem('gamesPlayed', 0);
            displayStats();
        }

        // Update the display of guesses and the number of tries left
        function updateGameDisplay() {
            let container = document.getElementById('guessesContainer');
            container.innerHTML = '';

            for (let i = 0; i < MAX_TRIES; i++) {
                let row = document.createElement('div');
                row.className = 'guess-row';

                for (let j = 0; j < MAX_WORD_LENGTH; j++) {
                    let tile = document.createElement('div');
                    tile.className = 'letter-tile';

                    if (i < game.guesses.length) {
                        let letter = game.guesses[i][j];
                        tile.textContent = letter;

                        if (letter === game.answerWord[j]) {
                            tile.classList.add('correct');
                        } else if (game.answerWord.includes(letter)) {
                            tile.classList.add('present');
                        } else {
                            tile.classList.add('absent');
                        }
                    }

                    row.appendChild(tile);
                }

                container.appendChild(row);
            }

            document.getElementById('triesLeft').textContent = game.triesLeft;
        }

        // Update the display of the on-screen keyboard based on the player's guesses
        function updateKeyboardDisplay() {
            const alphabets = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
            let keyboardContainer = document.getElementById('keyboardContainer');
            
            if (!keyboardContainer) {
                let container = document.querySelector('.container');
                let kb = document.createElement('div');
                kb.id = 'keyboardContainer';
                kb.className = 'keyboard';
                container.insertBefore(kb, document.getElementById('guessesContainer').nextSibling);
            }
            
            let kb = document.getElementById('keyboardContainer');
            kb.innerHTML = '';
            
            for (let i = 0; i < alphabets.length; i++) {
                let row = document.createElement('div');
                row.className = 'guess-row-small';

                var rowAlphabets = alphabets[i].split('');

                rowAlphabets.forEach(letter => {
                    let button = document.createElement('div');
                        button.textContent = letter;
                        
                        for (let i = game.guesses.length - 1; i >= 0; i--) {
                        if (game.guesses[i].includes(letter)) {
                            if (game.answerWord[game.guesses[i].indexOf(letter)] === letter) {
                                button.className = 'correct';
                            } else if (game.answerWord.includes(letter)) {
                                if (!button.classList.contains('correct')) {
                                    button.className = 'present';
                                }
                            } else {
                                if (!button.classList.contains('correct') && !button.classList.contains('present')) {
                                button.className = 'absent';
                                }
                            }
                        }
                    }

                    button.classList.add('letter-tile-small');
                    row.appendChild(button);
                });
                kb.appendChild(row);
            }
        }

        // Start the first game when the page loads
        window.onload = function() {
            var messageEl = document.getElementById('message');
            newGame();
            document.getElementById('header1').textContent = `Guess the ${MAX_WORD_LENGTH}-letter word in ${MAX_TRIES} attempts`;
        }

    </script>
</body>
</html>
